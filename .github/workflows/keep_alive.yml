name: Keep-Alive do App

on:
  schedule:
    # A cada 10 min, 9h-19h59 BRT (12h-22h59 UTC), seg-sex — horário comercial,
    # quando alguém tem mais chance de clicar no link (ex: LinkedIn). Mais
    # execuções que um cron fixo de poucas em poucas horas, mas concentradas
    # na janela que importa — nada desperdiçado de madrugada/fim de semana.
    - cron: "*/10 12-22 * * 1-5"
  workflow_dispatch:        # Permite disparo manual pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acessar o app para evitar hibernação
        run: |
          echo "Pingando https://fixacf.streamlit.app ..."
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 -L https://fixacf.streamlit.app/)
          echo "Status HTTP: $status"
          if [ "$status" -ge 400 ]; then
            echo "::warning::App respondeu com status $status — pode estar hibernando ou fora do ar."
          fi
