name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy core/ --ignore-missing-imports --no-error-summary

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=core --cov-report=term-missing --cov-fail-under=65

      - name: Run UI tests (AppTest)
        run: pytest tests/apptest -v --tb=short
